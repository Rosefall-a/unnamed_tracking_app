<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f1117" />
    <title>Archive is offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0f1117; color: #f7f7fb; }
      main { width: min(32rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #343849; border-radius: 1.5rem; background: #171a23; box-shadow: 0 24px 80px #0007; }
      img { width: 3rem; height: 3rem; }
      h1 { margin: 1rem 0 .5rem; }
      p { color: #bec0cc; line-height: 1.6; }
      button { border: 0; border-radius: .8rem; padding: .8rem 1rem; color: white; background: #6d28d9; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Archive is offline</h1>
      <p>Your library data stays on the server and is not cached on this device. Reconnect to continue safely.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
