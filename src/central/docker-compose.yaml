services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - unnamed_tracking_app_central_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  central:
    image: ghcr.io/rosefall-a/unnamed_tracking_app-central:feat-central-docker-image
    environment:
      # APP_MODE=both makes the central image run both processes. In this
      # mode BACKEND_URL automatically defaults to localhost:8000 because
      # both processes share the same container network namespace.
      APP_MODE: both
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    ports:
      - "5173:80"
      - "8000:8000"
    volumes:
      - ../../data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  unnamed_tracking_app_central_db:
