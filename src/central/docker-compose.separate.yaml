# Optional split-process example using the exact same central image for both services.
# The frontend container automatically proxies /api to http://backend:8000
# because APP_MODE=frontend and BACKEND_URL is not set.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - unnamed_tracking_app_split_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/rosefall-a/unnamed_tracking_app-central:feat-central-docker-image-v2
    environment:
      APP_MODE: backend
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/rosefall-a/unnamed_tracking_app-central:feat-central-docker-image-v2
    environment:
      APP_MODE: frontend
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  unnamed_tracking_app_split_db:
