worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    server {
        listen 80;
        server_name _;

        # Serve the startup HTML
        root /srv/startup;

        location = / {
            try_files /index.html =404;
        }

        # Serve favicon correctly
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            return 302 /_startup/favicon.svg;
        }

        # Serve status + details + backend log
        location = /_startup/status.json {
            alias /run/unnamed-tracking/status.json;
            add_header Cache-Control "no-store";
        }

        location = /_startup/details.txt {
            alias /run/unnamed-tracking/details.txt;
            add_header Cache-Control "no-store";
        }

        location = /_startup/backend.log {
            alias /run/unnamed-tracking/backend.log;
            add_header Cache-Control "no-store";
        }

        # FIXED: Serve startup.css, startup.js, favicon.svg, etc.
        location /_startup/ {
            alias /srv/startup/;
            try_files $uri =404;
        }
    }
}
