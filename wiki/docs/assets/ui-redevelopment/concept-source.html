<script>
(()=>{
const root=document.getElementById('uta-concepts');
const screens=[['home','Desktop Home'],['nav','Desktop navigation'],['mobileHome','Mobile Home'],['mobileNav','Mobile navigation'],['settings','Settings landing'],['preferences','Preferences'],['account','Account'],['admin','Administration'],['library','Games library'],['plugin','Plugin page & widget']];
const icons={home:'house',library:'library',media:'clapperboard',collections:'folders',cards:'layers',sets:'boxes',bounties:'target',calendar:'calendar-days',statistics:'chart-no-axes-combined',plugin:'puzzle',settings:'settings',preferences:'sliders-horizontal',account:'user-round',admin:'shield-check'};
const games=[['Hollow Knight','PC · Playing','forest','34h 12m'],['Outer Wilds','PC · Backlog','ocean','—'],['Disco Elysium','PC · Completed','space','41h 08m']];
const icon=n=>`<i data-lucide="${icons[n]||n}" aria-hidden="true"></i>`;
const button=(text,page,cls='')=>`<button type="button" class="cursor-interaction ${cls}" data-page="${page}">${text}</button>`;
const cover=(g)=>`<span class="cover ${g[2]}"><b>${g[0]}</b></span>`;
const gamesRows=()=>games.map(g=>`<div class="list-row">${cover(g)}<div class="row-body"><strong>${g[0]}</strong><p>${g[1]}</p></div><span class="muted">${g[3]}</span>${button('Open','library','plain')}</div>`).join('');
const gameCards=()=>`<div class="media-grid">${games.map(g=>`<button type="button" class="media-item cursor-interaction" data-page="library">${cover(g)}<strong>${g[0]}</strong><span class="muted">${g[1]}</span></button>`).join('')}</div>`;
const report=()=>`<div class="panel"><div class="heading-row" style="margin-bottom:0"><h3>Playtime this week</h3><span class="tag">Plugin</span></div><div class="metric">8h 24m</div><div class="muted">Across 3 games · illustrative data</div><div class="bars" role="img" aria-label="Illustrative weekly playtime bars, total 8 hours 24 minutes">${[24,64,40,19,78,51,34].map(h=>`<span class="bar" style="--bar:${h}%"></span>`).join('')}</div><div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div></div>`;
const settingsNav=page=>`<nav class="settings-nav" aria-label="Settings areas">${['settings','preferences','account','admin'].map(p=>button(p==='settings'?'Overview':p==='admin'?'Administration':p[0].toUpperCase()+p.slice(1),p,p===page?'active':'')).join('')}</nav>`;
const table=()=>`<div class="table-wrap"><table><thead><tr><th>Game</th><th>Platform</th><th>Status</th><th>Playtime</th><th>Action</th></tr></thead><tbody>${games.map(g=>`<tr><td class="game-name">${g[0]}</td><td>PC</td><td>${g[1].split(' · ')[1]}</td><td>${g[3]}</td><td>${button('Open','library','plain')}</td></tr>`).join('')}</tbody></table></div><div class="mobile-list">${gamesRows()}</div>`;
root.querySelectorAll('.uta-demo').forEach((demo,index)=>{
 const name=demo.dataset.design;const uid='uta-'+index;const state={page:'home',viewport:'desktop',theme:'auto',role:'admin',widget:false,menu:false,libraryFilter:'All games',radius:index===1?22:index===2?5:12};
 demo.innerHTML=`<div class="preview-controls"><strong>${name} <span style="font-size:12px;font-weight:400">· concept</span></strong><label>Screen<select data-control="screen" aria-label="${name} preview screen">${screens.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label><label>Viewport<select data-control="viewport" aria-label="${name} viewport"><option value="desktop">Desktop</option><option value="mobile">Phone</option></select></label><label>Theme<select data-control="theme" aria-label="${name} theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Role<select data-control="role" aria-label="${name} user role"><option value="admin">Administrator</option><option value="member">Normal user</option></select></label></div><div class="product" aria-label="${name} application preview"></div>`;
 const product=demo.querySelector('.product');
 const navBtn=(p,label)=>button(`${icon(p)}<span>${label}</span>`,p,`nav-button ${state.page===p?'active':''}`);
 function nav(){return `<aside class="sidebar"><div class="brand"><span class="mark">u</span>Unnamed Tracking</div><nav aria-label="Main navigation">${navBtn('home','Home')}${navBtn('library','Games')}${navBtn('media','Media')}${navBtn('collections','Collections')}<div class="nav-label">Organize</div>${navBtn('cards','Cards')}${navBtn('sets','Sets')}${navBtn('bounties','Bounties')}${navBtn('calendar','Calendar')}${navBtn('statistics','Statistics')}<div class="nav-label">Extensions</div>${navBtn('plugin','Sessions')}<span class="muted" style="padding:0 12px 8px;font-size:10px">Session Manager · plugin</span></nav><nav class="lower-nav" aria-label="Personal and server settings">${navBtn('preferences','Preferences')}${navBtn('account','Account')}${state.role==='admin'?navBtn('admin','Administration'):''}${navBtn('settings','Settings')}</nav></aside>`}
 function header(){const title=state.menu?'Menu':screens.find(s=>s[0]===state.page)?.[1]||'Home';return `<header class="topbar"><button type="button" class="mobile-menu plain cursor-interaction" data-action="menu" aria-label="${state.menu?'Close':'Open'} navigation menu">${icon(state.menu?'x':'menu')}</button><span class="breadcrumb">Workspace <span style="padding:0 8px">/</span> ${title.replace('Desktop ','')}</span><button type="button" class="search-button cursor-interaction" data-action="search">${icon('search')} Search anything <kbd>⌘ K</kbd></button><div class="right"><button type="button" class="notification plain cursor-interaction" data-action="notifications" aria-label="Notifications">${icon('bell')}</button><button type="button" class="plain cursor-interaction" data-page="account" aria-label="Open account"><span class="avatar">TO</span></button></div></header>${name==='Studio'?'<div class="workspace-strip"><span>Personal workspace</span><span>Games</span><span>Media</span><span>Plugins</span></div>':''}`}
 function heading(title,copy,action=''){return `<div class="heading-row"><div><h1>${title}</h1><p>${copy}</p></div>${action}</div>`}
 function home(){
  const resume=`<div class="resume">${cover(games[0])}<div><div class="eyebrow">Pick up where you left off</div><h2>Hollow Knight</h2><p>Playing · 34h 12m tracked</p>${button('View game','library','primary')}</div></div>`;
  const widget=state.widget?report():`<div class="panel"><h3>Make Home yours</h3><p>Start small. Add the information you want to see.</p><button type="button" class="cursor-interaction" data-action="widget">${icon('plus')} Add a widget</button></div>`;
  if(name==='Studio')return `${heading('Your workspace','A quiet starting point for your library.',button('Customize','plugin'))}<div class="quick-actions">${button('+ Add game','library','primary')}${button('Upload files','library')}${button('Open calendar','calendar')}</div><div class="pair"><section><div class="section-heading"><h2>Recently tracked</h2><span class="muted">3 games</span></div>${table()}<div class="section-heading"><h2>Recent activity</h2></div><div class="rows"><div class="list-row"><div class="row-body"><strong>Hollow Knight updated</strong><p>Status set to Playing</p></div><span class="muted">Today</span></div><div class="list-row"><div class="row-body"><strong>Disco Elysium completed</strong><p>Added to Finished collection</p></div><span class="muted">Yesterday</span></div></div></section><aside class="context-pane"><h3>Quick access</h3><div class="rows">${['collections','bounties','statistics'].map(p=>`<div class="list-row">${button(p[0].toUpperCase()+p.slice(1),p,'plain')}</div>`).join('')}</div><div style="margin-top:20px">${widget}</div></aside></div>`;
  if(name==='Pocket')return `${heading('Welcome back.','Your library, at your pace.')}<div class="quick-actions">${button('+ Track something','library','primary')}${button('Customize Home','plugin','plain')}</div>${resume}<div class="section-heading"><h2>On your shelf</h2>${button('View all','library','plain')}</div><div class="row-library">${gamesRows()}</div><div style="margin-top:22px">${widget}</div>`;
  return `${heading('Good evening, Toast','Your games, media, and a little room to make it yours.',button('Customize','plugin'))}<div class="quick-actions">${button('+ Add game','library','primary')}${button('Add media','media')}${button('Open calendar','calendar')}</div>${resume}<div class="section-heading"><h2>Recently tracked</h2>${button('View library','library','plain')}</div>${gameCards()}<div style="margin-top:26px">${widget}</div>`;
 }
 function menu(){const links=[['library','Games'],['media','Movies, TV & anime'],['collections','Collections'],['cards','Cards'],['sets','Sets'],['bounties','Bounties'],['calendar','Calendar'],['statistics','Statistics']];return `${heading('Your workspace','Everything in one place.')}<div class="menu-grid">${button(`${icon('home')} Home`,'home')}${links.map(([p,l])=>button(`${icon(p)} ${l}`,p)).join('')}</div><div class="menu-heading">From your plugins</div><div class="menu-grid">${button(`${icon('plugin')} Sessions`,'plugin')}</div><p class="muted" style="margin-top:10px">Session Manager · enabled plugin</p><div class="menu-heading">Personal</div><div class="menu-grid">${button(`${icon('preferences')} Preferences`,'preferences')}${button(`${icon('account')} Account`,'account')}${button(`${icon('settings')} Settings`,'settings')}</div>${state.role==='admin'?`<div class="menu-heading">Server-wide</div><div class="menu-grid">${button(`${icon('admin')} Administration`,'admin')}</div>`:''}`}
 function settings(){return `${heading('Settings','Your experience, your account, and your server.')}<div class="settings-layout">${settingsNav('settings')}<div class="settings-grid">${[['preferences','Preferences','Appearance, layout, accessibility and notifications'],['account','Account','Profile, sign-in, API keys and connected services'],...(state.role==='admin'?[['admin','Administration','Users, authentication, plugins and server maintenance']]:[])].map(([p,t,c])=>button(`<span><strong>${icon(p)} ${t}</strong><small>${c}</small></span><span class="arrow" aria-hidden="true">›</span>`,p,'settings-card')).join('')}<div class="panel"><h3>Library & connections</h3><p>Upload, imports, metadata sources and library management.</p>${button('Manage library','library','plain')}</div></div></div>`}
 function preferences(){return `${heading('Preferences','Make the application feel like yours.')}<div class="settings-layout">${settingsNav('preferences')}<div><div class="panel"><h2>Appearance & layout</h2><div class="setting-row"><div><label for="${uid}-theme">Theme</label><small>Applies to your preview</small></div><select id="${uid}-theme" data-action="theme"><option value="auto" ${state.theme==='auto'?'selected':''}>System</option><option value="light" ${state.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option></select></div><div class="setting-row"><div><label for="${uid}-density">Density</label><small>Space between controls and content</small></div><select id="${uid}-density"><option>Comfortable</option><option>Compact</option></select></div><div class="setting-row"><div><label for="${uid}-sidebar">Desktop navigation</label><small>Remembered on this device</small></div><select id="${uid}-sidebar"><option>Pinned</option><option>Icon rail</option><option>Overlay</option></select></div></div><div class="section-heading"><h2>Accessibility</h2></div><div class="panel"><div class="setting-row"><div><label for="${uid}-motion">Reduce motion</label><small>Keep transitions quiet</small></div><input id="${uid}-motion" type="checkbox" checked></div><div class="setting-row"><div><label for="${uid}-contrast">Higher contrast</label><small>Stronger boundaries and focus visibility</small></div><input id="${uid}-contrast" type="checkbox"></div></div><div class="section-heading"><h2>Notifications</h2></div><div class="panel"><div class="setting-row"><div><label for="${uid}-digest">Daily activity digest</label><small>Updates from your library</small></div><input id="${uid}-digest" type="checkbox" checked></div></div></div></div>`}
 function account(){return `${heading('Account','Your profile and access to this instance.')}<div class="settings-layout">${settingsNav('account')}<div><div class="panel"><div class="icon-label"><span class="avatar" style="width:48px;height:48px;font-size:16px">TO</span><div><h2>Toast</h2><span class="muted">Personal account</span></div></div><form data-action="profile"><div class="form-fields"><label>Display name<input value="Toast" autocomplete="name" required></label><label>Email<input type="email" value="toast@example.com" autocomplete="email" required></label></div><button type="submit" class="primary cursor-interaction">Save profile</button></form></div><div class="section-heading"><h2>Security & connections</h2></div><div class="panel"><div class="list-row"><div class="row-body"><strong>Password</strong><p>Manage your sign-in credentials</p></div><button type="button" data-action="preview" class="cursor-interaction">Change</button></div><div class="list-row"><div class="row-body"><strong>Active sessions</strong><p>Session Manager · plugin</p></div>${button('Review','plugin')}</div><div class="list-row"><div class="row-body"><strong>API keys</strong><p>Access keys for your account</p></div><button type="button" data-action="preview" class="cursor-interaction">Manage</button></div><div class="list-row"><div class="row-body"><strong>Connected services</strong><p>Personal integrations and identities</p></div><button type="button" data-action="preview" class="cursor-interaction">Manage</button></div></div></div></div>`}
 function admin(){if(state.role!=='admin')return settings();return `${heading('Administration','Manage this entire server instance.')}<div class="notice">${icon('shield-check')}<div><strong>Server-wide settings</strong><p>Changes here affect every user. Personal preferences are under Preferences.</p></div></div><div class="settings-layout">${settingsNav('admin')}<div class="settings-grid">${[['Users & access','Accounts, roles and authentication'],['Branding & system','Instance name, logo, favicon and upload limits'],['Plugins','Packages, permissions, compatibility and runtime'],['Notifications & maintenance','Delivery providers, scheduled tasks and backups']].map(([t,c])=>`<button type="button" class="settings-card cursor-interaction" data-action="preview"><span><strong>${t}</strong><small>${c}</small></span><span class="arrow" aria-hidden="true">›</span></button>`).join('')}</div></div>`}
 function library(){const title={media:'Media',collections:'Collections',cards:'Cards',sets:'Sets',bounties:'Bounties',calendar:'Calendar',statistics:'Statistics'}[state.page]||'Games';return `${heading(title,title==='Games'?'Everything you play, collected in one place.':'Part of your personal library.',button('+ Add game','library','primary'))}<div class="toolbar" aria-label="Game filters">${['All games','Playing','Backlog','Completed'].map(f=>`<button type="button" class="cursor-interaction ${f===state.libraryFilter?'active':''}" data-filter="${f}">${f}</button>`).join('')}<span class="muted" style="margin-left:auto">3 games</span></div>${state.libraryFilter!=='All games'?`<div class="panel">${gamesRowsFiltered()}</div>`:name==='Studio'?`<div class="panel">${table()}</div><div class="notice"><div><strong>Keyboard-ready library</strong><p>Search with / · navigate with j/k · open with Enter</p></div></div>`:name==='Pocket'?`<div class="row-library">${gamesRows()}</div>`:gameCards()}<div class="section-heading"><h2>Library tools</h2></div><div class="quick-actions">${button('Collections','collections')}${button('Cards & sets','cards')}${button('Bounties','bounties')}</div>`}
 function gamesRowsFiltered(){const g=games.find(x=>x[1].includes(state.libraryFilter));return g?`<div class="list-row">${cover(g)}<div class="row-body"><strong>${g[0]}</strong><p>${g[1]}</p></div><span class="muted">${g[3]}</span></div>`:'No games in this view.'}
 function plugin(){return `${heading('Sessions','Session Manager · plugin')}<div class="toolbar"><span class="tag">Scoped to your account</span><span class="muted">Concept for migrated v1.1 UI</span></div><div class="panel"><h2>Where you’re signed in</h2><div class="list-row"><span class="avatar">PC</span><div class="row-body"><strong>This device</strong><p>Desktop browser · active now</p></div><span class="tag">Current</span></div><div class="list-row"><span class="avatar">PH</span><div class="row-body"><strong>Phone browser</strong><p>Last active yesterday</p></div><button type="button" class="cursor-interaction" data-action="revoke">Review</button></div></div><div class="section-heading"><h2>Home widget</h2><button type="button" class="cursor-interaction" data-action="widget">${state.widget?'Remove from Home':'Add to Home'}</button></div>${report()}<div class="notice"><div><strong>Separate plugin permissions</strong><p>Session access stays scoped to your account. Home widgets appear only when enabled and added.</p></div></div>`}
 function render(){
  product.style.colorScheme=state.theme==='auto'?'light dark':state.theme;
  demo.style.colorScheme=state.theme==='auto'?'light dark':state.theme;
  product.classList.toggle('phone',state.viewport==='mobile');product.style.setProperty('--uta-radius',state.radius+'px');
  demo.querySelector('[data-control="theme"]').value=state.theme;demo.querySelector('[data-control="viewport"]').value=state.viewport;
  demo.querySelector('[data-control="screen"] option[value="admin"]').disabled=state.role!=='admin';
  const content=state.menu?menu():state.page==='home'?home():state.page==='settings'?settings():state.page==='preferences'?preferences():state.page==='account'?account():state.page==='admin'?admin():state.page==='plugin'?plugin():library();
  product.innerHTML=`<div class="shell">${nav()}<div class="workspace">${header()}<main>${content}</main><div class="toast" role="status" aria-live="polite"></div><nav class="bottom-nav" aria-label="Mobile primary navigation">${[['home','Home'],['library','Library'],['media','Media']].map(([p,l])=>button(`${icon(p)}${l}`,p,p===state.page&&!state.menu?'active':'')).join('')}<button type="button" class="cursor-interaction ${state.menu?'active':''}" data-action="menu">${icon('menu')}More</button></nav></div></div>`;
  if(state.role!=='admin')product.querySelectorAll('[data-page="admin"]').forEach(el=>el.remove());
  if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});
 }
 function toast(text){product.querySelector('.toast').textContent=text}
 function changePage(page){state.page=page;state.menu=false;demo.querySelector('[data-control="screen"]').value=page;render()}
 demo.addEventListener('change',e=>{
  const control=e.target.dataset.control;
  if(control==='screen'){const page=e.target.value;state.viewport=page.startsWith('mobile')?'mobile':page==='home'||page==='nav'?'desktop':state.viewport;state.page=page==='mobileHome'?'home':page==='mobileNav'||page==='nav'?'home':page;state.menu=page==='mobileNav'||page==='nav';}
  else if(control){state[control]=e.target.value;if(control==='role'&&state.role==='member'&&state.page==='admin')state.page='settings';}
  else if(e.target.dataset.action==='theme')state.theme=e.target.value;
  else{toast('Preference changed in this concept preview.');return;}
  render();
 });
 product.addEventListener('click',e=>{
  const target=e.target.closest('button');if(!target)return;
  if(target.type==='submit'){e.preventDefault();if(target.closest('form').reportValidity())toast('Profile saved in this concept preview only.');return;}
  if(target.dataset.page){changePage(target.dataset.page);return}
  if(target.dataset.filter){state.libraryFilter=target.dataset.filter;render();return}
  const action=target.dataset.action;
  if(action==='menu'){state.menu=!state.menu;render()}
  else if(action==='widget'){state.widget=!state.widget;render();toast(state.widget?'Playtime widget added to your preview Home.':'Widget removed from your preview Home.')}
  else if(action==='search')toast('Concept shortcut: ⌘/Ctrl K opens the application command palette.');
  else if(action==='notifications')toast('You’re up to date in this concept preview.');
  else if(action==='revoke')toast('The implemented flow will confirm before revoking this session.');
  else if(action==='preview')toast('Design preview only — no account or server changes are made.');
 });
 product.addEventListener('submit',e=>{e.preventDefault();toast('Profile saved in this concept preview only.')});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:product,onChange:()=>{product.style.setProperty('--uta-radius',state.radius+'px')}});tweak.addSlider(state,'radius',{label:'Corner radius',min:0,max:28,unit:'px',reference:'--uta-radius'});}
});
})();
</script>
