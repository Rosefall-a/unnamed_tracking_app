name: Resolve PR 390 merge
on:
  push:
    branches: [feat/production-realip]
permissions:
  contents: write
jobs:
  merge-base:
    if: github.actor == 'olie-ob'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-realip
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge base
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/production-hardening-tls
          git merge --no-commit --no-ff -X ours origin/feat/production-hardening-tls
          git rm -f .github/workflows/merge-pr390.yml
          git commit -m "Merge feat/production-hardening-tls into feat/production-realip"
          git push origin HEAD:feat/production-realip
