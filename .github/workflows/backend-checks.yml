name: Backend checks

on:
  push:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-checks.yml"

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unnamed_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d unnamed_tracking_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: src/backend

    env:
      PYTHONPATH: ${{ github.workspace }}/src/backend
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/unnamed_tracking_test
      PRIMARY_USER_USERNAME: test
      PRIMARY_USER_EMAIL: test@example.com
      PRIMARY_USER_PASSWORD: test-password
      SECRET_KEY: test-secret-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Alembic migration graph
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = script.get_heads()
          print("Alembic heads:", heads)
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found {len(heads)}: {heads}")
          PY

      - name: Run mypy
        run: mypy --config-file pyproject.toml src

      - name: Run pylint
        run: |
          pylint src | tee pylint-output.txt
          score=$(grep -oP 'Your code has been rated at \K[0-9.]+(?=/10)' pylint-output.txt)
          echo "Pylint score: $score"
          python -c "import sys; sys.exit(0 if float('$score') >= 9.0 else 1)"
