name: Backend checks

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONPATH: ${{ github.workspace }}/src/backend
  DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/unnamed_tracking_test
  PRIMARY_USER_USERNAME: test
  PRIMARY_USER_EMAIL: test@example.com
  PRIMARY_USER_PASSWORD: test-password
  SECRET_KEY: XJVqc8r7Uj801VzGUYhlQV8A2tZTBepjOYEiP2pTzFk=

jobs:
  backend-tests:
    name: Backend tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unnamed_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d unnamed_tracking_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare test database
        run: alembic upgrade head 2>&1 | tee migrations-output.txt
      - name: Run tests
        run: |
          set -o pipefail
          pytest 2>&1 | tee pytest-output.txt
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/backend/pytest-output.txt
            src/backend/migrations-output.txt
          if-no-files-found: ignore

  migration-graph:
    name: Alembic migration graph
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Alembic migration graph
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          versions = Path("src/database/migrations/versions")
          revisions = {}
          for path in sorted(versions.glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              revision = None
              down_revision = None
              for node in tree.body:
                  if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                      name = node.target.id
                      if name in {"revision", "down_revision"}:
                          value = ast.literal_eval(node.value)
                          if name == "revision":
                              revision = value
                          else:
                              down_revision = value
                  elif isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                              value = ast.literal_eval(node.value)
                              if target.id == "revision":
                                  revision = value
                              else:
                                  down_revision = value
              if revision:
                  parents = [] if down_revision is None else list(down_revision) if isinstance(down_revision, tuple) else [down_revision]
                  revisions[revision] = (path.name, parents)

          print("Loaded", len(revisions), "Alembic revisions")
          missing = sorted({parent for _, parents in revisions.values() for parent in parents if parent not in revisions})
          if missing:
              raise SystemExit(f"Missing Alembic parent revisions: {missing}")

          state = {}
          stack = []

          def visit(revision):
              state[revision] = 1
              stack.append(revision)
              for parent in revisions[revision][1]:
                  if state.get(parent) == 1:
                      cycle_start = stack.index(parent)
                      cycle = stack[cycle_start:] + [parent]
                      print("Alembic cycle detected:")
                      for item in cycle:
                          print("  ", item, "<-", revisions[item][1])
                      raise SystemExit("Alembic migration graph contains a cycle")
                  if state.get(parent, 0) == 0:
                      visit(parent)
              stack.pop()
              state[revision] = 2

          for revision in revisions:
              if state.get(revision, 0) == 0:
                  visit(revision)

          children = {revision: 0 for revision in revisions}
          for _, parents in revisions.values():
              for parent in parents:
                  children[parent] += 1
          heads = sorted(revision for revision, count in children.items() if count == 0)
          print("Alembic heads:", heads)
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found {len(heads)}: {heads}")
          PY

  backend-file-size:
    name: Backend file size
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Python file sizes
        run: |
          python - <<'PY'
          from pathlib import Path

          maximum = 1000
          excluded = Path("src/database/migrations")
          violations = []
          for path in Path("src").rglob("*.py"):
              if excluded in path.parents:
                  continue
              text = path.read_text(encoding="utf-8")
              if "pylint: disable=too-many-lines" in text:
                  print(f"Skipping line-limit check for {path}: pylint too-many-lines is disabled.")
                  continue
              line_count = text.count("\n") + (1 if text else 0)
              if line_count > maximum:
                  violations.append((path, line_count))

          if violations:
              print("Python files exceeding the 1,000-line maximum:")
              for path, line_count in sorted(violations):
                  print(f"  {path}: {line_count} lines")
              raise SystemExit(1)

          print("All non-migration Python files are at or below 1,000 lines.")
          PY

  backend-mypy:
    name: Backend mypy
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run mypy
        run: |
          set -o pipefail
          mypy --config-file pyproject.toml src 2>&1 | tee mypy-output.txt
      - name: Upload mypy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mypy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/backend/mypy-output.txt
          if-no-files-found: ignore

  backend-pylint:
    name: Backend pylint
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pylint
        run: |
          set -o pipefail
          pylint src | tee pylint-output.txt
          score=$(grep -oP 'Your code has been rated at \K[0-9.]+(?=/10)' pylint-output.txt)
          echo "Pylint score: $score"
          python -c "import sys; sys.exit(0 if float('$score') >= 9.0 else 1)"
      - name: Upload pylint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pylint-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/backend/pylint-output.txt
          if-no-files-found: ignore

  backend-checks:
    name: Backend checks
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs:
      - backend-tests
      - migration-graph
      - backend-file-size
      - backend-mypy
      - backend-pylint
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend check to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["CHECK_RESULTS"])
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if failures:
              raise SystemExit(f"Backend checks did not all pass: {failures}")
          PY
      - name: Report to Actions Dashboard
        if: always() && vars.PUSH_TO_DISPLAY_ENABLED == 'true'
        uses: pushtodisplay/actions-dashboard@ce26532a36af079259315587543935064f22e6b4
        env:
          PUSH_TO_DISPLAY_API_KEY: ${{ secrets.PUSH_TO_DISPLAY_API_KEY }}
          PUSH_TO_DISPLAY_BOARD: ${{ vars.PUSH_TO_DISPLAY_BOARD }}
        with:
          steps-json: ${{ toJSON(steps) }}
          panel-id: 2
          label: Backend CI
