name: Fix beta media search argument ordering

on:
  push:
    branches:
      - beta-1-media-search

jobs:
  fix:
    if: github.ref == 'refs/heads/beta-1-media-search'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix argument ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("src/backend/src/features/metadata/games/search.py")
          text = p.read_text()
          old = '''    preferences: dict[str, Any] | None = None,\n    user: "User | None" = None,\n    include_image_providers: bool = True,\n    igdb_client_id: str | None = None,\n    igdb_client_secret: str | None = None,\n'''
          new = '''    preferences: dict[str, Any] | None = None,\n    user: "User | None" = None,\n    igdb_client_id: str | None = None,\n    igdb_client_secret: str | None = None,\n    include_image_providers: bool = True,\n'''
          if old not in text:
              raise SystemExit("search_game_metadata signature not found")
          p.write_text(text.replace(old, new, 1))

          p = Path("src/backend/src/api/routes/games.py")
          text = p.read_text()
          old = '''            current_user,\n            include_images,\n            app_integrations.igdb_client_id,\n            app_integrations.igdb_client_secret,\n'''
          new = '''            current_user,\n            app_integrations.igdb_client_id,\n            app_integrations.igdb_client_secret,\n            include_images,\n'''
          if old not in text:
              raise SystemExit("games.py search call not found")
          p.write_text(text.replace(old, new, 1))

          Path(".github/workflows/_fix-beta-media-search.yml").unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve metadata search argument ordering"
          git push origin HEAD:beta-1-media-search
