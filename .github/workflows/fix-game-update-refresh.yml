name: Fix game update refresh

on:
  push:
    branches:
      - fix/screenshot-upload

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove invalid platform refresh
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/backend/src/api/routes/games.py")
          text = path.read_text()
          old = '    await db.refresh(game, attribute_names=["platforms"])\n    return game\n'
          new = '    return game\n'
          if old not in text:
              raise SystemExit("Expected invalid platform refresh was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-game-update-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/src/api/routes/games.py .github/workflows/fix-game-update-refresh.yml
          git commit -m "Fix game update 500 error"
          git push
