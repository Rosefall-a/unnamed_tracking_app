name: Fix manual artwork upload errors

on:
  push:
    paths:
      - .github/workflows/fix-manual-art-upload.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Improve artwork upload validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/backend/src/api/routes/games.py")
          text = path.read_text()
          old = '''    target_path = await save_game_asset(image_bytes, game_id, asset_kind)\n\n    return {\n'''
          new = '''    try:\n        target_path = await save_game_asset(image_bytes, game_id, asset_kind)\n    except (OSError, ValueError) as exc:\n        raise HTTPException(\n            status_code=status.HTTP_400_BAD_REQUEST,\n            detail=f"Could not process image: {exc}",\n        ) from exc\n\n    return {\n'''
          if old not in text:
              raise SystemExit("Expected manual artwork save block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/src/api/routes/games.py
          git diff --cached --check
          git commit -m "Handle manual artwork upload errors"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-manual-art-upload.yml
          git commit -m "Remove temporary artwork fix workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
