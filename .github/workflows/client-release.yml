name: Publish client release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/androidapp
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/archive-release.keystore
      ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Require and decode Android signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is required for releases"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ORG_GRADLE_PROJECT_releaseStoreFile"
      - name: Test and build signed release APKs
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Stage Android downloads
        run: |
          mkdir -p build/release
          cp app/build/outputs/apk/release/app-release.apk build/release/tracking-native.apk
          cp webapp/build/outputs/apk/release/webapp-release.apk build/release/tracking-web.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: src/androidapp/build/release/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/windowsapp
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test Tracking.Windows.Tests/Tracking.Windows.Tests.csproj --configuration Release
      - run: dotnet publish Tracking.Windows/Tracking.Windows.csproj --configuration Release --runtime win-x64 --self-contained false --output build/publish
      - name: Package Windows downloads
        shell: pwsh
        run: |
          Compress-Archive -Path build/publish/* -DestinationPath build/tracking-windows-web.zip
          Copy-Item packaging/AppxManifest.xml build/publish/AppxManifest.xml
          Copy-Item packaging/Assets build/publish/Assets -Recurse
          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { throw "makeappx.exe was not found" }
          & $makeAppx.FullName pack /d build/publish /p build/tracking-windows-web.msix /o
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) { throw "WINDOWS_CERTIFICATE_BASE64 is required for releases" }
          $certificate = Join-Path $env:RUNNER_TEMP "archive-release.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          & $signTool.FullName sign /fd SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD build/tracking-windows-web.msix
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            src/windowsapp/build/tracking-windows-web.zip
            src/windowsapp/build/tracking-windows-web.msix

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: find artifacts -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS.txt
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
