name: Fix per-user folder validation

on:
  push:
    branches:
      - feature/playnite-guid

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/playnite-guid
          fetch-depth: 0
      - name: Fix folder validation scope
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/backend/src/api/routes/games.py')
          text = path.read_text()

          old_sig = '''async def _ensure_folder_location_available(\n    folder_name: str,\n    db: AsyncSession,\n    exclude_game_id: UUID | None = None,\n) -> None:\n    stmt = select(Game.id).where(Game.folder_location == folder_name, Game.deleted_at.is_(None))'''
          new_sig = '''async def _ensure_folder_location_available(\n    folder_name: str,\n    user_id: UUID,\n    db: AsyncSession,\n    exclude_game_id: UUID | None = None,\n) -> None:\n    stmt = select(Game.id).where(\n        Game.user_id == user_id,\n        Game.folder_location == folder_name,\n        Game.deleted_at.is_(None),\n    )'''
          if old_sig not in text:
              raise SystemExit('Expected helper body was not found; refusing to make a broad edit.')
          text = text.replace(old_sig, new_sig, 1)

          pattern = r'(_ensure_folder_location_available\(\s*[^,\n]+),\s*db,'
          text, count = re.subn(pattern, r'\1, current_user.id, db,', text)
          if count == 0:
              raise SystemExit('No helper callers were updated; refusing to commit a partial fix.')

          path.write_text(text)
          print(f'Updated helper and {count} caller(s).')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/backend/src/api/routes/games.py
          git diff --cached --check
          git commit -m 'Fix per-user folder conflict validation'
          git push origin feature/playnite-guid
