name: Build and test production Docker container

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/olie-ob/unnamed_tracking_app

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker-container/Dockerfile
          load: true
          tags: unnamed_tracking_app:ci
          cache-from: type=gha,scope=production-container
          cache-to: type=gha,mode=max,scope=production-container

      - name: Verify startup UI survives application configuration failure
        run: |
          docker run -d --name unnamed-tracking-failed -p 18081:80             -e DATABASE_URL=postgresql+psycopg://invalid:invalid@127.0.0.1:5432/invalid             unnamed_tracking_app:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18081/_startup/status.json | grep -q '"overall":"failed"'; then
              curl -fsS http://127.0.0.1:18081/ | grep -q "Starting application"
              docker rm -f unnamed-tracking-failed
              exit 0
            fi
            sleep 1
          done
          docker logs unnamed-tracking-failed
          docker rm -f unnamed-tracking-failed
          exit 1

      - name: Start PostgreSQL
        run: |
          docker network create unnamed-tracking-ci
          docker run -d --name unnamed-tracking-db --network unnamed-tracking-ci             -e POSTGRES_USER=unnamed_tracking             -e POSTGRES_PASSWORD=ci-password             -e POSTGRES_DB=unnamed_tracking             postgres:18
          for i in $(seq 1 60); do
            docker exec unnamed-tracking-db pg_isready -U unnamed_tracking -d unnamed_tracking && break
            sleep 2
          done

      - name: Start production container
        run: |
          docker run -d --name unnamed-tracking-app --network unnamed-tracking-ci -p 18080:80             -e DATABASE_URL=postgresql+psycopg://unnamed_tracking:ci-password@unnamed-tracking-db:5432/unnamed_tracking             -e SECRET_KEY=ci-test-secret-key             -e PRIMARY_USER_USERNAME=admin             -e PRIMARY_USER_EMAIL=admin@example.invalid             -e PRIMARY_USER_PASSWORD=ci-password             unnamed_tracking_app:ci

      - name: Verify startup page is independent
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/_startup/status.json && exit 0
            sleep 1
          done
          docker logs unnamed-tracking-app
          exit 1

      - name: Verify production application
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/ | grep -q "<html"; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/_startup/status.json | grep -q '"overall":"ready"'
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'

      - name: Publish production image
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag unnamed_tracking_app:ci "$IMAGE_NAME:$GITHUB_REF_NAME"
          docker tag unnamed_tracking_app:ci "$IMAGE_NAME:sha-$GITHUB_SHA"
          docker push "$IMAGE_NAME:$GITHUB_REF_NAME"
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs unnamed-tracking-app || true
          docker logs unnamed-tracking-db || true
