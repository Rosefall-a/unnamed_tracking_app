name: pylint

on:
  push:
    paths:
      - "src/backend/**"
      - ".github/workflows/pylint.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/pylint.yml"
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src/backend
    defaults:
      run:
        shell: bash
        working-directory: src/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Enforce Pylint 10/10
        run: |
          pylint --rcfile=pyproject.toml --fail-under=10 --score=y src 2>&1 | tee pylint-output.txt
      - name: Upload Pylint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/backend/pylint-output.txt
          if-no-files-found: ignore
