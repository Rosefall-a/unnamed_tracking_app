name: Temporary folder index fix

on:
  push:
    branches:
      - fix/per-user-game-folder-uniqueness

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix model index without unrelated changes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/backend/src/database/models/game.py")
          text = path.read_text()
          old = '''        # a plain unique constraint would block reusing a deleted game's\n        # folder name for the full 7-day trash window — this only enforces\n        # uniqueness among games that are actually active\n        Index(\n            "ix_games_folder_location_active",\n            "folder_location",\n            unique=True,\n            postgresql_where=text("deleted_at IS NULL"),\n        ),'''
          new = '''        # folder names only need to be unique within a user's storage\n        # namespace. Different users can therefore safely use the same\n        # folder name while still keeping active games unique per user.\n        Index(\n            "ix_games_user_folder_location_active",\n            "user_id",\n            "folder_location",\n            unique=True,\n            postgresql_where=text("deleted_at IS NULL"),\n        ),'''
          if old not in text:
              raise SystemExit("Expected original index definition was not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit model fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/src/database/models/game.py
          git commit -m "fix: scope game folder uniqueness per user"
          git push
