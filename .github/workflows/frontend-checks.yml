name: Frontend Checks

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed frontend files
        id: changes
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -q '^src/frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-checks:
    needs: changes
    if: needs.changes.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Check frontend source file sizes
        if: needs.changes.outputs.frontend == 'true'
        run: node tools/check_frontend_size.mjs

      - name: Fix formatting
        working-directory: src/frontend
        run: npm run format:fix

      - name: Commit formatting fixes
        if: github.event_name == 'pull_request' && github.head_repository.full_name == github.repository
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/frontend
          git commit -m "chore: auto-fix frontend formatting"
          git push origin HEAD:${{ github.head_ref }}

      - name: Check formatting
        working-directory: src/frontend
        run: npm run format

      - name: Lint
        id: frontend-lint
        working-directory: src/frontend
        run: npm run lint

      - name: Type check
        id: frontend-typecheck
        working-directory: src/frontend
        run: npm run typecheck

      - name: Tests
        id: frontend-tests
        working-directory: src/frontend
        run: npm run test

      - name: Report to Actions Dashboard
        if: always() && vars.PUSH_TO_DISPLAY_ENABLED == 'true'
        uses: pushtodisplay/actions-dashboard@ce26532a36af079259315587543935064f22e6b4
        env:
          PUSH_TO_DISPLAY_API_KEY: ${{ secrets.PUSH_TO_DISPLAY_API_KEY }}
          PUSH_TO_DISPLAY_BOARD: ${{ vars.PUSH_TO_DISPLAY_BOARD }}
        with:
          steps-json: ${{ toJSON(steps) }}
          panel-id: 1
          label: Frontend CI
