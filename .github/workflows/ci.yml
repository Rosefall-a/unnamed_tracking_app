name: CI/CD Pipeline - Build, Test, and Push Image

on:
  push:
    branches: [ main ] # Trigger on push to the main branch
  pull_request:
    branches: [ main ] # Run tests on pull requests

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production # Use an environment for deployment tracking (optional)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Setup and Dependency Installation ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Match the python version in Dockerfile if possible

      - name: Install dependencies for testing (including poetry or pipenv setup)
        run: |
          # Assuming requirements.txt contains necessary libraries, plus pytest/httpx for local testing needs
          pip install -r src/backend/requirements.txt 
          pip install pytest httpx[async] sqlalchemy-utils psycopg2-binary

      # --- Testing Stage (Crucial step before building) ---
      - name: Run Unit Tests
        run: |
          pytest tests/unit --asyncio-mode=auto
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }} # Use a secure secret for test run
          # Add other necessary environment variables here

      # --- Docker Build and Push Stage (Only runs on push to main) ---
  deploy:
    needs: build-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Buildx for multi-platform builds
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/game-tracker:latest,${{ github.sha }}
          # Use the existing Dockerfile path
          file: ./dockerfile