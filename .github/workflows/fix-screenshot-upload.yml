name: Fix screenshot upload storage path

on:
  push:
    branches:
      - fix/screenshot-upload

jobs:
  fix:
    if: github.event.head_commit.message == 'fix screenshot upload storage path'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix media paths
        run: |
          python - <<'PY'
          from pathlib import Path

          games = Path("src/backend/src/api/routes/games.py")
          text = games.read_text()
          replacements = {
              "_DATA_ROOT / game.folder_location": '_DATA_ROOT / str(game.user_id) / "games" / game.folder_location',
              '_DATA_ROOT / (game.folder_location or "")': '_DATA_ROOT / str(game.user_id) / "games" / (game.folder_location or "")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected text not found in games.py: {old}")
              text = text.replace(old, new)
          games.write_text(text)

          media = Path("src/backend/src/api/routes/media.py")
          text = media.read_text()
          old = 'GAMES_DATA_ROOT / game.folder_location / media_subdir(kind)'
          new = 'GAMES_DATA_ROOT / str(current_user.id) / "games" / game.folder_location / media_subdir(kind)'
          if old not in text:
              raise SystemExit("Expected inbox assignment path not found in media.py")
          media.write_text(text.replace(old, new))
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backend/src/api/routes/games.py src/backend/src/api/routes/media.py
          git diff --cached --check
          git commit -m "Fix screenshot upload storage path"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-screenshot-upload.yml
          git commit -m "Remove temporary screenshot fix workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
