name: Ruff

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "src/backend/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/backend/**"

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: src/backend

jobs:
  ruff:
    name: Ruff
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Apply Ruff fixes
        run: |
          ruff format .
          ruff check . --fix
      - name: Commit Ruff fixes to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git add -- src/backend
          if git diff --cached --quiet; then
            echo "No Ruff fixes needed."
          else
            git fetch origin "refs/heads/$PR_BRANCH"
            if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_HEAD" ]; then
              echo "::notice::The PR branch advanced; a newer run will apply Ruff fixes."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: apply Ruff fixes"
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
      - name: Check Ruff formatting
        run: ruff format . --check
      - name: Check Ruff lint
        run: ruff check . --output-format=github
