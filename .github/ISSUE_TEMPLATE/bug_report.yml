name: Bug report
description: Report a reproducible problem with Rosefall-a/unnamed_tracking_app.
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Include a small reproduction and the exact version you tested.
        Please report application problems here with enough detail for someone else to reproduce them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reliably reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Application version
      description: Release/version, commit SHA, or exact Docker image tag. If this is a regression, include the last working version if known.
      placeholder: "Version or SHA: ...\nLast working version (if known): ..."
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running the application?
      options:
        - Production Docker image
        - Development Docker Compose stack
        - Local source checkout
        - Another setup (describe below)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment / context
      description: Browser and OS, relevant configuration, and whether this affects one user or everyone.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include the error and surrounding lines. For CI failures, link the failed run/job. Remove passwords, tokens, and personal data.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or other evidence
      description: Attach images for UI problems or link a small reproduction. Avoid screenshots containing credentials or private data.
