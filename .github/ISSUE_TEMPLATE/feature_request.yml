name: Feature request
description: Suggest an improvement or new feature.
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Search existing requests first. Explain who needs the change, the problem it solves, and the expected behavior.
        Features for individual plugins belong in their plugin repository; host Plugin API and plugin management requests belong here.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: Who is affected, what are they trying to do, and what prevents them from doing it today?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or experience you would like to see.
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: What would success look like?
      description: Give one or two observable outcomes or examples. Mention compatibility or accessibility needs where relevant.
      placeholder: "A user can ...\nExisting ... continues to work."

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions, workarounds, or existing approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, links, or other information that would help explain the request.
