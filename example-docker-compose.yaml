services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - unnamed_tracking_app_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/rosefall-a/unnamed_tracking_app-backend:latest
    environment:
      APP_DATA_DIR: /data
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    volumes:
      - unnamed_tracking_app_data:/data
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/rosefall-a/unnamed_tracking_app-frontend:latest
    environment:
      APP_MODE: frontend
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  unnamed_tracking_app_db:
  unnamed_tracking_app_data:
