version: '3.8'

services:
  db:
    image: postgres:16 # Use a common, stable version like 16
    container_name: game_tracker_db
    environment:
      # Set sensible defaults for local use or explicit deployment
      POSTGRES_USER: user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: game_tracking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data # Use named volume for persistence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d game_tracking"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile # Point to the updated backend Dockerfile
    container_name: game_tracker_api
    environment:
      # Use the default credentials from the db service and define hostname explicitly
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000" # Expose the container port directly for production simplicity
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile # Assuming frontend uses a separate Dockerfile
    container_name: game_tracker_ui
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  pgdata:
# This example setup assumes default user/pass credentials and removes local volume mounts for a more stable, production-like setup.