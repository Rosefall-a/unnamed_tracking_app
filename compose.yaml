# Development compose file. Run from the repository root with:
#   docker compose up --build
#
# The backend and frontend are built from their checked-in Dockerfiles, while
# source directories are bind-mounted for development/HMR. PostgreSQL data
# and Archive's encrypted configuration live in named/local persistent data.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archive-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-archive}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./src/backend
      dockerfile: dockerfile
    environment:
      APP_DATA_DIR: /data
      POSTGRES_USER: ${POSTGRES_USER:-archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archive-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-archive}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./src/backend/src:/app/src
      - ./src/backend/alembic:/app/alembic
      - ./src/backend/alembic.ini:/app/alembic.ini:ro
      - ./data:/data
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    environment:
      APP_MODE: frontend
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
