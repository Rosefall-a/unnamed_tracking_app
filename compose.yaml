services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
      dockerfile: dockerfile
    environment:
      APP_DATA_DIR: /data
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    volumes:
      - ./src/backend/src:/app/src
      - ./data:/data
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    environment:
      APP_MODE: frontend
      BACKEND_URL: http://backend:8000
    ports:
      - "5173:80"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
